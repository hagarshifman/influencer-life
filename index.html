<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>חיי אינפלואנסרית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1ED;
    --surface:#FFFFFF;
    --surface-alt:#F1E8E2;
    --border:#E9DED6;
    --text:#241D22;
    --text-muted:#8B7F87;
    --accent:#FF5470;
    --accent-contrast:#FFFFFF;
    --accent-soft:#FFE1E7;
    --money:#B9812A;
    --money-soft:#FBEBD0;
    --wellbeing:#1F8E82;
    --wellbeing-soft:#DDF2EE;
    --shadow: 0 30px 60px -25px rgba(36,29,34,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161016;
      --surface:#221A22;
      --surface-alt:#2B222B;
      --border:#3A2E3A;
      --text:#F5EDF2;
      --text-muted:#B09DAE;
      --accent:#FF7189;
      --accent-contrast:#241019;
      --accent-soft:#3A1E27;
      --money:#E0AC4F;
      --money-soft:#3A2C18;
      --wellbeing:#4FC3B8;
      --wellbeing-soft:#163531;
      --shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161016;
    --surface:#221A22;
    --surface-alt:#2B222B;
    --border:#3A2E3A;
    --text:#F5EDF2;
    --text-muted:#B09DAE;
    --accent:#FF7189;
    --accent-contrast:#241019;
    --accent-soft:#3A1E27;
    --money:#E0AC4F;
    --money-soft:#3A2C18;
    --wellbeing:#4FC3B8;
    --wellbeing-soft:#163531;
    --shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{
    overflow:hidden;
    height:100%;
  }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Heebo", system-ui, sans-serif;
    display:flex;
    justify-content:center;
    height:100dvh;
  }
  h1,h2,h3,.display{
    font-family:"Rubik", system-ui, sans-serif;
    text-wrap:balance;
  }
  #phone{
    width:100%;
    max-width:420px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    height:100dvh;
    position:relative;
    animation:fadeIn .5s ease both;
    overflow:hidden;
  }
  @media (min-width:560px){
    body{ padding:40px 16px; align-items:center; }
    #phone{
      min-height:min(844px, 92vh);
      height:min(844px, 92vh);
      border-radius:38px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      overflow:hidden;
    }
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }

  #app{
    display:flex; flex-direction:column; flex:1; min-height:0;
  }

  .content{
    flex:1; min-height:0; overflow-y:auto; padding:30px 22px 28px;
    display:flex; flex-direction:column; gap:18px;
  }

  .eyebrow{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--accent);
  }
  .progress{ display:flex; gap:6px; }
  .progress span{ height:5px; flex:1; border-radius:3px; background:var(--border); }
  .progress span.done{ background:var(--accent); }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:20px; display:flex; flex-direction:column; gap:14px;
  }

  label{ font-size:13px; font-weight:700; color:var(--text-muted); }
  input[type="text"], input[type="number"]{
    font-family:inherit; font-size:17px; font-weight:600; color:var(--text);
    background:var(--surface-alt); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; width:100%; outline:none;
  }
  input[type="text"]:focus, input[type="number"]:focus{ border-color:var(--accent); }

  .niche-grid{ display:flex; flex-direction:column; gap:10px; }
  .niche-card{
    display:flex; align-items:center; gap:12px; text-align:start;
    padding:14px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface-alt);
    font-family:inherit; cursor:pointer; color:var(--text);
  }
  .niche-card svg{ flex-shrink:0; width:22px; height:22px; }
  .niche-card .t{ font-weight:700; font-size:15px; }
  .niche-card .d{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .niche-card[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .niche-card[aria-pressed="true"] svg{ color:var(--accent); }
  .niche-card svg{ color:var(--text-muted); }

  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, .niche-card:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .btn-primary{
    background:var(--accent); color:var(--accent-contrast); border:none; border-radius:14px;
    padding:15px; font-size:16px; font-weight:700; width:100%; transition:transform .12s ease;
  }
  .btn-primary:disabled{ opacity:.45; }
  .btn-primary:active:not(:disabled){ transform:scale(.98); }

  .statheader{
    display:flex; align-items:center; gap:10px; padding:30px 22px 14px; flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
    display:flex; align-items:center; justify-content:center; font-family:"Rubik"; font-weight:600; font-size:16px; flex-shrink:0;
  }
  .who{ min-width:0; }
  .who .name{ font-weight:700; font-size:14.5px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .niche{ font-size:11.5px; color:var(--text-muted); }
  .stats{ display:flex; gap:6px; margin-inline-start:auto; }
  .stat{
    display:flex; align-items:center; gap:4px; background:var(--surface-alt); border-radius:999px;
    padding:6px 9px; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .stat svg{ width:13px; height:13px; }
  .stat.followers{ color:var(--accent); } .stat.money{ color:var(--money); } .stat.wellbeing{ color:var(--wellbeing); }

  .prompt-card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:20px 18px;
  }
  .prompt-card h2{ font-size:19px; font-weight:600; line-height:1.4; margin:0; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:center; gap:12px; text-align:start; width:100%;
    background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:13px 14px;
    color:var(--text); font-size:14.5px; font-weight:600; transition:transform .12s ease, border-color .15s ease;
  }
  .option:active{ transform:scale(.98); border-color:var(--accent); }
  .option .k{
    flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--surface-alt); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; font-family:"Rubik"; font-size:13px; font-weight:600;
  }

  .outcome-banner{
    background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px;
    animation:pop .35s ease both;
  }
  @keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:none;} }
  .outcome-banner p{ margin:0; font-size:17.5px; font-weight:500; line-height:1.55; }
  .deltas{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .delta{
    display:flex; align-items:center; gap:5px; border-radius:999px; padding:7px 12px; font-size:13px; font-weight:700;
    font-variant-numeric:tabular-nums; animation:pop .4s ease both;
    background:var(--surface-alt); border:1px solid var(--border); color:var(--text);
  }
  .delta svg{ width:12px; height:12px; color:var(--text-muted); flex-shrink:0; }

  .gauge-card{ text-align:center; }
  .gauge-hearts{ position:relative; height:56px; margin-bottom:4px; }
  @keyframes floatHeart{
    0%{ transform:translateY(0) scale(.5); opacity:0; }
    15%{ opacity:1; transform:translateY(-8px) scale(1); }
    100%{ transform:translateY(-62px) scale(1.15); opacity:0; }
  }
  .floating-heart{
    position:absolute; bottom:0; font-size:20px; line-height:1;
    animation: floatHeart 1.1s ease-out forwards;
    pointer-events:none;
  }
  .gauge-track{
    position:relative; height:14px; border-radius:999px; margin:18px 0 10px;
    background:linear-gradient(90deg, var(--wellbeing), var(--money) 50%, var(--border));
  }
  .gauge-needle{
    position:absolute; top:-5px; width:4px; height:24px; border-radius:2px;
    background:var(--text); box-shadow:0 0 0 3px var(--surface);
    left:50%; transform:translateX(-50%);
    transition:left .45s cubic-bezier(.3,0,.2,1);
  }
  .gauge-labels{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted); font-weight:700; }
  .gauge-divider{ height:1px; background:var(--border); margin:4px 0; }

  .backdrop{
    position:absolute; inset:0; background:rgba(10,6,10,.5);
    opacity:0; transition:opacity .3s ease; z-index:5; pointer-events:none;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:absolute; left:50%; top:50%; z-index:6;
    width:min(340px, 86%);
    background:var(--bg); border-radius:24px;
    padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    transform:translate(-50%,-50%) scale(.92);
    opacity:0;
    transition:transform .34s cubic-bezier(.22,1,.36,1), opacity .28s ease;
    max-height:78%; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px;
  }
  .sheet.open{ transform:translate(-50%,-50%) scale(1); opacity:1; }

  @keyframes statGlow{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,84,112,0); }
    50%{ box-shadow:0 0 0 6px var(--accent-soft); }
  }
  .stat.counting{ animation: statGlow .7s ease-in-out infinite; }

  .titlecard{ text-align:center; padding:26px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .titlecard .rank{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); }
  .titlecard h1{ font-size:30px; font-weight:700; margin:0; color:var(--accent); }
  .titlecard .tag{ font-size:14px; color:var(--text-muted); max-width:280px; }

  .finalstats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .finalstat{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 8px; text-align:center; }
  .finalstat svg{ width:18px; height:18px; margin-bottom:4px; }
  .finalstat .v{ font-family:"Rubik"; font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; }
  .finalstat .l{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }

  .journey{ display:flex; flex-direction:column; gap:8px; }
  .journey h3{ font-size:13px; color:var(--text-muted); font-family:inherit; font-weight:700; margin:0; }
  .jrow{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
  .jrow .lv{ font-size:11px; font-weight:700; color:var(--accent); }
  .jrow .ch{ font-size:13.5px; font-weight:700; margin-top:2px; }
  .jrow .ot{ font-size:12.5px; color:var(--text-muted); margin-top:2px; line-height:1.4; }

  .milestone-card{
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:20px;
    padding:28px 22px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
    animation:pop .4s ease both;
  }
  .milestone-card .milestone-icon{ width:40px; height:40px; color:var(--accent); }
  .milestone-card .milestone-icon svg{ width:100%; height:100%; }
  .milestone-card h1{ font-size:22px; margin:4px 0 0; color:var(--accent); }
  .milestone-card p{ margin:0; font-size:14.5px; color:var(--text); line-height:1.5; max-width:280px; }
</style>

<div id="phone" dir="rtl" lang="he">
  <div id="app"></div>
</div>

<script>
(function(){
  "use strict";

  const ICONS = {
    followers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.1"/><path d="M2.7 19.5c0-3.5 2.8-6 6.3-6s6.3 2.5 6.3 6"/><circle cx="17" cy="9" r="2.4" opacity=".55"/><path d="M15.2 14c2.6.4 4.4 2.5 4.4 5.4" opacity=".55"/></svg>',
    money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.3"/><circle cx="12" cy="12" r="3"/></svg>',
    wellbeing: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.1s-7.3-4.6-7.3-9.7A4.4 4.4 0 0112 7.4a4.4 4.4 0 017.3 3c0 5.1-7.3 9.7-7.3 9.7z"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.1 6.6L21 11l-6.9 2.1L12 20l-2.1-6.9L3 11l6.9-1.9z"/></svg>',
    fork: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3v7.2a2 2 0 004 0V3M8.5 10.2V21M17 3c-1.8 0-3.2 2.2-3.2 5.2 0 2.4 1 4.3 2.4 4.9V21"/></svg>'
  };

  const HEBREW_LETTERS = ["א","ב","ג"];

  const NICHES = [
    { id:"lifestyle", label:"לייף סטייל ויוקרה", desc:"חיים אסתטיים, טיולים, ימים שאפתניים.", icon:ICONS.sparkle, bonus:{followers:50,money:0,wellbeing:0} },
    { id:"bodypositive", label:"בודי פוזיטיב", desc:"דיבור כן, אהבה עצמית, בלי פילטרים.", icon:ICONS.wellbeing, bonus:{followers:0,money:0,wellbeing:10} },
    { id:"food", label:"אוכל ומתכונים", desc:"מתכונים, ביקורות, כאוס במטבח.", icon:ICONS.fork, bonus:{followers:0,money:40,wellbeing:0} }
  ];

  function out(text, f, m, w){ return { text, effects:{ followers:f||0, money:m||0, wellbeing:w||0 } }; }

  const SCENARIOS_PER_LEVEL = 3;
  const LEVEL4_FOLLOWER_GATE = 5000;

  const MILESTONES = [
    { id:"followers_1000", threshold:1000, title:"פריצת דרך!", text:"עברת 1,000 עוקבים — יוצרים ומותגים גדולים יותר מתחילים לשים לב." },
    { id:"followers_5000", threshold:LEVEL4_FOLLOWER_GATE, title:"אימפריה בהתהוות!", text:"עברת 5,000 עוקבים — דלתות שלא ידעת שקיימות מתחילות להיפתח." }
  ];

  const LEVELS = [
    { name:"צעדים ראשונים", scenarios:[
      { prompt:"הסרטון הראשון שלך זוכה לתשומת לב אמיתית — ויחד איתה מגיעה גם התגובה המתסכלת הראשונה שלך. מה את עושה?", options:[
        { label:"להגיב ולהתגונן", outcomes:[ out("עמדת על שלך ואחרות הצטרפו לתמוך בך.",200,0,5), out("זה הפך לוויכוח הלוך ושוב שהתיש אותך.",40,0,-15) ] },
        { label:"למחוק את התגובה ולחסום", outcomes:[ out("פשוט ונקי — את מרגישה יותר בשליטה במרחב שלך.",0,0,10), out("היא צילמה מסך והאשימה אותך ב'צנזורה'.",-100,0,-5) ] },
        { label:"לצחוק על זה בפוסט הבא", outcomes:[ out("ההומור שלך כובש את הלבבות — זה הופך לרגע מדובר.",400,0,10), out("כמעט אף אחד לא שם לב, אבל את גאה בעצמך שלא נלחצת.",0,0,5) ] }
      ]},
      { prompt:"מותג מקומי קטן מציע לך מוצר בחינם (בלי תשלום) בתמורה לפרסום. את מסכימה?", options:[
        { label:"להסכים ולפרסם על זה", outcomes:[ out("הקהל שלך אוהב כמה זה מרגיש אותנטי.",200,0,5), out("זה נופל בלי הצלחה מיוחדת — יש שמגיבים שזה 'מרגיש כמו פרסומת'.",40,0,-5) ] },
        { label:"לבקש תשלום קטן במקום המוצר", outcomes:[ out("הם מכבדים את הבקשה ומשלמים לך משהו.",60,50,10), out("הם מסרבים ונעלמים.",0,0,-5) ] },
        { label:"לסרב, זה עוד לא שווה את הזמן שלך", outcomes:[ out("את מתמקדת בתוכן שלך במקום — וזה משתלם.",300,0,5), out("כלום לא באמת משתנה השבוע.",0,0,0) ] }
      ]},
      { prompt:"הגעת לאבן דרך קטנה בעוקבים! האפליקציה מציעה לקדם את פוסט החגיגה שלך תמורת כמה שקלים. את מקדמת אותו?", gaugeReveal:true, options:[
        { label:"לקדם את הפוסט", outcomes:[ out("הוא מגיע לאנשים חדשים שנשארים לעקוב.",500,-20,5), out("הוא בקושי זז.",40,-20,-5) ] },
        { label:"לא לשלם, לתת לזה לצמוח בטבעיות", outcomes:[ out("זה צובר תאוצה לאט לאט — מרגיש הרבה יותר אמיתי.",240,0,10), out("כמעט אף אחד לא רואה את זה בלי הקידום.",20,0,0) ] },
        { label:"לבקש מהעוקבים שלך לשתף בעצמם", outcomes:[ out("הקהילה שלך מגיעה בגדול.",400,0,15), out("כמה אנשים משתפים, תוצאה צנועה.",120,0,5) ] }
      ]},
      { prompt:"ההורים שלך רוצים שתלמדי תואר 'רציני' ויתייחסו ליצירת תוכן כתחביב, לא כקריירה.", options:[
        { label:"להבטיח לאזן בין שניהם", outcomes:[ out("את מצליחה לשלב לימודים ותוכן — מתיש, אבל זה עובד לבינתיים.",100,0,-10), out("בין הלימודים לפוסטים את נשרפת מהר ונופלת אחורה בשניהם.",40,0,-20) ] },
        { label:"לעמוד על שלך, זו הקריירה האמיתית שלך", outcomes:[ out("הם מודאגים, אבל הרצינות שלך גם מקנה קצת כבוד.",300,0,5), out("זה יוצר מתח אמיתי בבית, גם אם את לא מוותרת.",200,0,-15) ] },
        { label:"להסכים להשהות ולהתמקד בתואר בינתיים", outcomes:[ out("התוכן יורד בעדיפות, אבל בבית נהיה רגוע יותר.",-60,0,15), out("את בקושי מפרסמת והחשבון נהיה שקט לתקופה.",-160,0,10) ] }
      ]},

  function titleFor(stats){
    if (stats.wellbeing <= 25) return { rank:"תוצאת הקריירה", title:"שחוקה לגמרי", tag:"מספר העוקבים נראה מעולה על הנייר — אבל את שרופה לגמרי. הגיע הזמן לנוח לפני שאת מעלה עוד פוסט." };
    if (stats.followers >= 10000) return { rank:"תוצאת הקריירה", title:"אייקון גלובלי", tag:"השם שלך חצה גבולות ויצא מהמסך — את כבר לא רק יוצרת תוכן, את תופעה עולמית." };

    if (stats.followers >= 1800) return { rank:"תוצאת הקריירה", title:"כוכבת עולה", tag:"צמיחה יציבה, תנופה אמיתית — את הופכת לשם שאנשים עוקבים אחריו." };
    return { rank:"תוצאת הקריירה", title:"מיקרו-אינפלואנסרית", tag:"קהילה קטנה ואמיתית שבאמת שמה לב אלייך. נקודת התחלה מצוינת להמשך הדרך." };

  function freshState(startScreen){
    return {
      screen: startScreen || "landing", name:"", age:22, nicheId:null, stats:null,
      levelIndex:0, levelPool:[], scenarioInLevel:0,
      scenario:null, chosenOption:null, outcome:null, journey:[],
      milestonesShown:[], pendingMilestone:null, statsBefore:null
    };
  }
  state = freshState();

  function clampWellbeing(w){ return Math.max(0, Math.min(100, w)); }

  function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function prefersReducedMotion(){
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function animateValue(el, from, to, duration, formatter, onDone){
    if (!el) return;
    if (from === to || prefersReducedMotion()){
      el.textContent = formatter(to);
      if (onDone) onDone();
      return;
    }
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const value = Math.round(from + (to - from) * eased);
      el.textContent = formatter(value);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }

  function animateStat(key, from, to, formatter){
    const wrap = document.querySelector(".stat." + key);
    const el = document.getElementById("val-" + key);
    if (!el) return;
    if (from === to){
      el.textContent = formatter(to);
      return;
    }
    if (wrap) wrap.classList.add("counting");
    animateValue(el, from, to, 2000, formatter, () => { if (wrap) wrap.classList.remove("counting"); });
  }

  function revealOutcome(textEl, finalText, reduceMotion, onSettle){
    if (!textEl) return;
    textEl.textContent = finalText;
    if (reduceMotion){
      if (onSettle) onSettle();
      return;
    }
    setTimeout(() => { if (onSettle) onSettle(); }, 350);
  }

  function isEligible(scenario){
    return scenario.minFollowers === undefined || state.stats.followers >= scenario.minFollowers;
  }

  function drawNextScenario(){
    const eligible = state.levelPool.filter(isEligible);
    const pool = eligible.length ? eligible : state.levelPool;
    const chosen = pickRandom(pool);
    state.levelPool = state.levelPool.filter(s => s !== chosen);
    return chosen;
  }

  function enterLevel(levelIndex){
    state.levelIndex = levelIndex;
    state.levelPool = LEVELS[levelIndex].scenarios.slice();
    state.scenarioInLevel = 0;
    state.scenario = drawNextScenario();
  }

  function render(){
    if (state.screen === "landing") return renderLanding();
    if (state.screen === "create") return renderCreate();
    if (state.screen === "scenario") return renderScenario();
    if (state.screen === "gauge") return renderGauge();
    if (state.screen === "outcome") return renderOutcome();
    if (state.screen === "milestone") return renderMilestone();
    if (state.screen === "summary") return renderSummary();
  }

  function statHeader(beforeStats){
    const niche = NICHES.find(n => n.id === state.nicheId);
    const initial = state.name ? state.name.trim().charAt(0).toUpperCase() : "?";
    const f0 = beforeStats ? beforeStats.followers : state.stats.followers;
    const m0 = beforeStats ? beforeStats.money : state.stats.money;
    const w0 = beforeStats ? beforeStats.wellbeing : state.stats.wellbeing;
    return `
      <div class="statheader">
        <div class="avatar">${initial}</div>
        <div class="who">
          <div class="name">${escapeHtml(state.name)}</div>
          <div class="niche">${niche ? niche.label : ""}</div>
        </div>
        <div class="stats">
          <div class="stat followers">${ICONS.followers}<span id="val-followers">${formatCompact(f0)}</span></div>
          <div class="stat money">${ICONS.money}<span id="val-money">${formatCompact(m0)} ₪</span></div>
          <div class="stat wellbeing">${ICONS.wellbeing}<span id="val-wellbeing">${w0}%</span></div>
        </div>
      </div>`;
  }

  function progressBar(){
    let dots = "";
    const levelsKnown = state.levelIndex === 3 ? 4 : 3;
    const total = levelsKnown * SCENARIOS_PER_LEVEL;
    const idx = state.levelIndex * SCENARIOS_PER_LEVEL + state.scenarioInLevel;
    for (let i=0;i<total;i++){ dots += `<span class="${i <= idx ? 'done' : ''}"></span>`; }
    return `<div class="progress">${dots}</div>`;
  }

  function formatCompact(n){
    const sign = n < 0 ? "-" : "";
    const abs = Math.abs(n);
    if (abs >= 1000){
      let v = abs / 1000;
      let str = v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10);
      if (str.endsWith(".0")) str = str.slice(0, -2);
      return `${sign}${str}K`;
    }
    return `${sign}${abs}`;
  }

    return (str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderLanding(){
    app.innerHTML = `
      <div class="content" style="justify-content:center; align-items:center; text-align:center;">
        <div>
          <div class="eyebrow">סימולטור קריירה</div>
          <h1 style="margin:10px 0 10px;font-size:28px;">יום אחד, קריירה שלמה</h1>
          <p style="margin:0;color:var(--text-muted);font-size:15px;max-width:300px;">רגעים מכריעים יעצבו את הקריירה שלך כיוצרת תוכן. בואו נראה לאן האלגוריתם לוקח אותך.</p>
        </div>
        <button class="btn-primary" id="landing-start-btn" style="margin-top:6px;">התחלה</button>
      </div>`;
    document.getElementById("landing-start-btn").addEventListener("click", () => {
      state.screen = "create";
      render();
    });
  }

  function renderCreate(){
    app.innerHTML = `
      <div class="content">
        <div>
          <div class="eyebrow">פרופיל חדש</div>
          <h1 style="margin:6px 0 2px;font-size:24px;">בואו נבנה את הדמות שלך</h1>
          <p style="margin:0;color:var(--text-muted);font-size:14px;">כמה בחירות קטנות, ואז מתחילה הקריירה.</p>
        </div>
        <div class="card">
          <div>
            <label for="f-name">השם שלך</label>
            <input id="f-name" type="text" placeholder="לדוגמה: הגר" maxlength="18" value="${escapeHtml(state.name)}">
          </div>
          <div>
            <label for="f-age">הגיל שלך</label>
            <input id="f-age" type="number" inputmode="numeric" min="13" max="99" value="${state.age}">
          </div>
        </div>
        <div>
          <label style="display:block;margin-bottom:10px;">תחום התוכן שלך</label>
          <div class="niche-grid" id="niche-grid">
            ${NICHES.map(n => `
              <button type="button" class="niche-card" data-id="${n.id}" aria-pressed="${state.nicheId===n.id}">
                ${n.icon}
                <span>
                  <div class="t">${n.label}</div>
                  <div class="d">${n.desc}</div>
                </span>
              </button>`).join("")}
          </div>
        </div>
        <button class="btn-primary" id="start-btn" ${!(state.name.trim() && state.nicheId) ? "disabled" : ""}>להתחיל את הקריירה</button>
      </div>`;

    document.getElementById("f-name").addEventListener("input", e => {
      state.name = e.target.value;
      document.getElementById("start-btn").disabled = !(state.name.trim() && state.nicheId);
    });
    document.getElementById("f-age").addEventListener("input", e => { state.age = e.target.value; });
    document.querySelectorAll(".niche-card").forEach(btn => {
      btn.addEventListener("click", () => {
        state.nicheId = btn.dataset.id;
        render();
      });
    });
    document.getElementById("start-btn").addEventListener("click", startGame);
  }

  function startGame(){
    const niche = NICHES.find(n => n.id === state.nicheId);
    state.stats = {
      followers: 300 + niche.bonus.followers,
      money: 0 + niche.bonus.money,
      wellbeing: clampWellbeing(70 + niche.bonus.wellbeing)
    };
    state.milestonesShown = [];
    state.pendingMilestone = null;
    state.statsBefore = null;
    enterLevel(0);
    state.screen = "scenario";
    render();
  }

  function renderScenario(){
    const level = LEVELS[state.levelIndex];
    app.innerHTML = `
      ${statHeader()}
      <div class="content">
        ${progressBar()}
        <div class="eyebrow">שלב ${state.levelIndex+1} · ${level.name}</div>
        <div class="prompt-card"><h2>${escapeHtml(state.scenario.prompt)}</h2></div>
        <div class="options">
          ${state.scenario.options.map((opt, i) => `
            <button class="option" data-i="${i}">
              <span class="k">${HEBREW_LETTERS[i]}</span>
              <span>${escapeHtml(opt.label)}</span>
            </button>`).join("")}
        </div>
      </div>`;
    document.querySelectorAll(".option").forEach(btn => {
      btn.addEventListener("click", () => chooseOption(parseInt(btn.dataset.i,10)));
    });
  }

  function chooseOption(i){
    playCoinSound();
    const option = state.scenario.options[i];
    const outcome = pickRandom(option.outcomes);
    state.statsBefore = { followers: state.stats.followers, money: state.stats.money, wellbeing: state.stats.wellbeing };
    const followersBefore = state.stats.followers;
    state.stats.followers = Math.max(0, state.stats.followers + outcome.effects.followers);
    state.stats.money = Math.max(0, state.stats.money + outcome.effects.money);
    state.stats.wellbeing = clampWellbeing(state.stats.wellbeing + outcome.effects.wellbeing);
    state.chosenOption = option;
    state.outcome = outcome;
    state.journey.push({ level: LEVELS[state.levelIndex].name, choice: option.label, outcome: outcome.text });

    const crossed = MILESTONES.find(m => !state.milestonesShown.includes(m.id) && followersBefore < m.threshold && state.stats.followers >= m.threshold);
    if (crossed){
      state.milestonesShown.push(crossed.id);
      state.pendingMilestone = crossed;
    }

    if (state.scenario.gaugeReveal && !prefersReducedMotion()){
      state.screen = "gauge";
    } else {
      state.screen = "outcome";
    }
    render();
  }

  function deltaChip(icon, value, kind){
    let shown;
    if (value === 0){
      shown = "0";
    } else {
      const sign = value > 0 ? "+" : "-";
      const abs = Math.abs(value);
      if (kind === "money") shown = `${sign}${abs.toLocaleString()} ₪`;
      else if (kind === "percent") shown = `${sign}${abs}%`;
      else shown = `${sign}${abs.toLocaleString()}`;
    }
    return `<div class="delta">${icon}<span>${shown}</span></div>`;
  }

  function spawnHeart(container){
    if (!container) return;
    const heart = document.createElement("span");
    heart.className = "floating-heart";
    heart.textContent = "❤️";
    heart.style.left = (10 + Math.random() * 80) + "%";
    heart.style.animationDuration = (0.9 + Math.random() * 0.5) + "s";
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 1500);
  }

  function renderGauge(){
    app.innerHTML = `
      ${statHeader(state.statsBefore)}
      <div class="content">
        ${progressBar()}
        <div class="eyebrow">בחרת</div>
        <div class="prompt-card" style="padding:16px 18px;"><h2 style="font-size:16px;">${escapeHtml(state.chosenOption.label)}</h2></div>
      </div>
      <div class="backdrop" id="gauge-backdrop"></div>
      <div class="sheet gauge-card" id="gauge-sheet">
        <div class="eyebrow">הפוסט שלך יוצא לעולם…</div>
        <div class="gauge-hearts" id="gauge-hearts"></div>
        <div class="gauge-track"><div class="gauge-needle" id="gauge-needle"></div></div>
        <div class="gauge-labels"><span>💔 פלופ</span><span>🔥 וויראלי</span></div>
      </div>`;

    requestAnimationFrame(() => {
      const backdropEl = document.getElementById("gauge-backdrop");
      const sheetEl = document.getElementById("gauge-sheet");
      if (backdropEl) backdropEl.classList.add("open");
      if (sheetEl) sheetEl.classList.add("open");
    });

    const isGood = state.outcome === state.chosenOption.outcomes[0];
    const needleEl = document.getElementById("gauge-needle");
    const heartsEl = document.getElementById("gauge-hearts");
    const finalPos = isGood ? 15 : 85;

    const heartInterval = setInterval(() => spawnHeart(heartsEl), 180);

    const steps = [
      { pos: 65, delay: 320 }, { pos: 25, delay: 360 }, { pos: 75, delay: 400 },
      { pos: 20, delay: 460 }, { pos: finalPos, delay: 560 }
    ];
    let cumulative = 0;
    steps.forEach(step => {
      cumulative += step.delay;
      setTimeout(() => {
        if (needleEl) needleEl.style.left = step.pos + "%";
      }, cumulative);
    });

    setTimeout(() => {
      clearInterval(heartInterval);
      revealGaugeOutcome();
    }, cumulative + 650);
  }

  function revealGaugeOutcome(){
    const sheetEl = document.getElementById("gauge-sheet");
    if (!sheetEl) return;
    const e = state.outcome.effects;
    const isLast = state.levelIndex === LEVELS.length - 1 && state.scenarioInLevel === SCENARIOS_PER_LEVEL - 1;
    sheetEl.insertAdjacentHTML("beforeend", `
      <div class="gauge-divider"></div>
      <div class="outcome-banner">
        <p id="outcome-text">${escapeHtml(state.outcome.text)}</p>
      </div>
      <div class="deltas" id="deltas-wrap">
        ${deltaChip(ICONS.followers, e.followers, "count")}
        ${deltaChip(ICONS.money, e.money, "money")}
        ${deltaChip(ICONS.wellbeing, e.wellbeing, "percent")}
      </div>
      <button class="btn-primary" id="continue-btn">${isLast ? "לצפייה בסיכום הקריירה" : "להמשיך"}</button>
    `);
    document.getElementById("continue-btn").addEventListener("click", continueGame);

    if (state.statsBefore){
      animateStat("followers", state.statsBefore.followers, state.stats.followers, v => formatCompact(v));
      animateStat("money", state.statsBefore.money, state.stats.money, v => `${formatCompact(v)} ₪`);
      animateStat("wellbeing", state.statsBefore.wellbeing, state.stats.wellbeing, v => `${v}%`);
    }
  }

  function renderOutcome(){
    const e = state.outcome.effects;
    const isLast = state.levelIndex === LEVELS.length - 1 && state.scenarioInLevel === SCENARIOS_PER_LEVEL - 1;
    app.innerHTML = `
      ${statHeader(state.statsBefore)}
      <div class="content">
        ${progressBar()}
        <div class="eyebrow">בחרת</div>
        <div class="prompt-card" style="padding:16px 18px;"><h2 style="font-size:16px;">${escapeHtml(state.chosenOption.label)}</h2></div>
      </div>
      <div class="backdrop" id="outcome-backdrop"></div>
      <div class="sheet" id="outcome-sheet">
        <div class="outcome-banner">
          <p id="outcome-text">${escapeHtml(state.outcome.text)}</p>
        </div>
        <div class="deltas" id="deltas-wrap">
          ${deltaChip(ICONS.followers, e.followers, "count")}
          ${deltaChip(ICONS.money, e.money, "money")}
          ${deltaChip(ICONS.wellbeing, e.wellbeing, "percent")}
        </div>
        <button class="btn-primary" id="continue-btn">${isLast ? "לצפייה בסיכום הקריירה" : "להמשיך"}</button>
      </div>`;
    document.getElementById("continue-btn").addEventListener("click", continueGame);

    requestAnimationFrame(() => {
      const backdropEl = document.getElementById("outcome-backdrop");
      const sheetEl = document.getElementById("outcome-sheet");
      if (backdropEl) backdropEl.classList.add("open");
      if (sheetEl) sheetEl.classList.add("open");
    });

    const reduceMotion = prefersReducedMotion();
    const textEl = document.getElementById("outcome-text");

    function runStatAnimation(){
      if (!state.statsBefore) return;
      animateStat("followers", state.statsBefore.followers, state.stats.followers, v => formatCompact(v));
      animateStat("money", state.statsBefore.money, state.stats.money, v => `${formatCompact(v)} ₪`);
      animateStat("wellbeing", state.statsBefore.wellbeing, state.stats.wellbeing, v => `${v}%`);
    }

    revealOutcome(textEl, state.outcome.text, reduceMotion, runStatAnimation);
  }

  function continueGame(){
    state.statsBefore = null;
    if (state.pendingMilestone){
      state.screen = "milestone";
      render();
      return;
    }
    advanceScenario();
  }

  function advanceScenario(){
    if (state.scenarioInLevel < SCENARIOS_PER_LEVEL - 1){
      state.scenarioInLevel += 1;
      state.scenario = drawNextScenario();
      state.screen = "scenario";
    } else if (state.levelIndex === 2 && state.stats.followers < LEVEL4_FOLLOWER_GATE){
      state.screen = "summary";
    } else if (state.levelIndex < LEVELS.length - 1){
      enterLevel(state.levelIndex + 1);
      state.screen = "scenario";
    } else {
      state.screen = "summary";
    }
    render();
  }

  function renderMilestone(){
    const m = state.pendingMilestone;
    app.innerHTML = `
      ${statHeader()}
      <div class="content" style="justify-content:center;">
        <div class="milestone-card">
          <div class="milestone-icon">${ICONS.sparkle}</div>
          <div class="eyebrow">אבן דרך בצמיחה</div>
          <h1>${escapeHtml(m.title)}</h1>
          <p>${escapeHtml(m.text)}</p>
        </div>
        <button class="btn-primary" id="milestone-continue-btn">להמשיך</button>
      </div>`;
    document.getElementById("milestone-continue-btn").addEventListener("click", () => {
      state.pendingMilestone = null;
      advanceScenario();
    });
  }

  function renderSummary(){
    const result = titleFor(state.stats);
    app.innerHTML = `
      ${statHeader()}
      <div class="content">
        <div class="titlecard">
          <div class="rank">${result.rank}</div>
          <h1>${result.title}</h1>
          <p class="tag">${result.tag}</p>
        </div>
        <div class="finalstats">
          <div class="finalstat" style="color:var(--accent);">${ICONS.followers}<div class="v">${state.stats.followers.toLocaleString()}</div><div class="l">עוקבים</div></div>
          <div class="finalstat" style="color:var(--money);">${ICONS.money}<div class="v">${state.stats.money.toLocaleString()} ₪</div><div class="l">כסף</div></div>
          <div class="finalstat" style="color:var(--wellbeing);">${ICONS.wellbeing}<div class="v">${state.stats.wellbeing}%</div><div class="l">רווחה</div></div>
        </div>
        <div class="journey">
          <h3>המסע שלך</h3>
          ${state.journey.map(j => `
            <div class="jrow">
              <div class="lv">${j.level}</div>
              <div class="ch">${escapeHtml(j.choice)}</div>
              <div class="ot">${escapeHtml(j.outcome)}</div>
            </div>`).join("")}
        </div>
        <button class="btn-primary" id="again-btn">לשחק שוב</button>
      </div>`;
    document.getElementById("again-btn").addEventListener("click", () => {
      state = freshState("create");
      render();
    });
  }

  render();
})();
</script>

</body></html>
